<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manutenção do Hotel</title>
<script>try{var t=localStorage.getItem("hotel_tema");if(t)document.documentElement.dataset.theme=t==="escuro"?"dark":"light"}catch(e){}</script>
<style>
:root{color-scheme:light dark;--bg:#e9ecef;--paper:#fff;--head:#dfe3e7;--zebra:#f5f6f8;--hov:#e6eefa;--line:#c3c9cf;--ink:#1c2024;--mute:#5d666f;--acc:#1d4f91;--accT:#fff;
--urg:#a8231b;--urgbg:#fbe1de;--imp:#7a4e00;--impbg:#fdecc4;--nor:#2a6636;--norbg:#e0f0e3;--bar-u:#c62d24;--bar-i:#e0a100;--bar-n:#3f9a52}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171a;--paper:#1c2024;--head:#2a2f35;--zebra:#21262b;--hov:#243447;--line:#3a4148;--ink:#e8ebee;--mute:#98a2ab;--acc:#6aa5ec;--accT:#0f1720;--urg:#ff9a92;--urgbg:#4a2220;--imp:#ffc766;--impbg:#463413;--nor:#7fd391;--norbg:#1d3a25;--bar-u:#ff6b60;--bar-i:#f2b01e;--bar-n:#4fbf68}}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark;--bg:#14171a;--paper:#1c2024;--head:#2a2f35;--zebra:#21262b;--hov:#243447;--line:#3a4148;--ink:#e8ebee;--mute:#98a2ab;--acc:#6aa5ec;--accT:#0f1720;--urg:#ff9a92;--urgbg:#4a2220;--imp:#ffc766;--impbg:#463413;--nor:#7fd391;--norbg:#1d3a25;--bar-u:#ff6b60;--bar-i:#f2b01e;--bar-n:#4fbf68}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.bar{display:flex;align-items:stretch;gap:20px;background:var(--paper);border-bottom:1px solid var(--line);padding:0 16px;flex-wrap:wrap}
.bar h1{margin:0;font-size:1.05rem;font-weight:700;align-self:center;padding:10px 0}
.tabs{display:flex;gap:2px}
.tabs button{border:0;background:none;padding:0 14px;min-height:48px;cursor:pointer;border-bottom:3px solid transparent;color:var(--mute);font-weight:500}
.tabs button[aria-pressed=true]{border-bottom-color:var(--acc);color:var(--ink);font-weight:700}
.tabs span{color:var(--mute);font-weight:400;margin-left:5px;font-variant-numeric:tabular-nums}
.who{margin-left:auto;align-self:center;font-size:.9rem;color:var(--mute);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.who b{color:var(--ink)}
.lnk{background:none;border:0;color:var(--acc);text-decoration:underline;cursor:pointer;padding:0;font-size:.9rem}
.status{font-size:.8rem}
main{max-width:1240px;margin:0 auto;padding:14px 16px 24px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tools input,.tools select{height:38px;padding:0 10px;border:1px solid var(--line);border-radius:3px;background:var(--paper)}
.tools input{flex:1;min-width:180px;max-width:340px}
.sp{flex:1}
.btn{height:38px;padding:0 16px;border:1px solid var(--line);border-radius:3px;background:var(--paper);font-weight:600;cursor:pointer}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--accT)}
.sum{margin:0 0 8px;color:var(--mute);font-size:.9rem}.sum b{color:var(--ink)}
.wrap{border:1px solid var(--line);background:var(--paper);overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:820px}
th{text-align:left;background:var(--head);padding:8px 10px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);font-size:.85rem;font-weight:700;white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);vertical-align:middle}
th:last-child,td:last-child{border-right:0}
tbody tr{cursor:pointer}
tbody tr:nth-child(even){background:var(--zebra)}
tbody tr:hover{background:var(--hov)}
td:first-child{box-shadow:inset 5px 0 0 var(--c);padding-left:14px}
tr.U{--c:var(--bar-u)}tr.I{--c:var(--bar-i)}tr.N{--c:var(--bar-n)}
.num,.dat,.ago{font-variant-numeric:tabular-nums;white-space:nowrap}.num{color:var(--mute)}
.tit{font-weight:600}
.u{display:inline-block;padding:1px 8px;border-radius:2px;font-size:.85rem;font-weight:700;white-space:nowrap}
.U .u{background:var(--urgbg);color:var(--urg)}.I .u{background:var(--impbg);color:var(--imp)}.N .u{background:var(--norbg);color:var(--nor)}
.pg{display:flex;justify-content:space-between;align-items:center;margin-top:10px;color:var(--mute);font-size:.9rem;gap:8px;flex-wrap:wrap}
.pg button{padding:8px 14px;border:1px solid var(--line);background:var(--paper);border-radius:3px;cursor:pointer;margin-left:6px}
.pg button:disabled{opacity:.4;cursor:default}
.empty{text-align:center;color:var(--mute);padding:34px 10px;background:var(--paper);border:1px dashed var(--line)}
.badge{display:inline-block;padding:2px 9px;border-radius:2px;font-size:.85rem;font-weight:700}
.b-Urgente{background:var(--urgbg);color:var(--urg)}.b-Importante{background:var(--impbg);color:var(--imp)}
.b-Normal{background:var(--norbg);color:var(--nor)}.b-Concluído{background:var(--norbg);color:var(--nor)}
dialog{border:1px solid var(--line);border-radius:4px;padding:0;width:min(94vw,560px);max-height:92vh;background:var(--paper);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.55)}
.x{position:absolute;top:8px;right:10px;width:40px;height:40px;border:0;background:none;font-size:1.2rem;color:var(--mute);cursor:pointer}
.m{padding:20px}.m h2{margin:0 34px 12px 0;font-size:1.15rem}
label{display:block;font-weight:600;font-size:.88rem;margin:12px 0 4px}
input[type=text],textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:3px;background:var(--bg)}
textarea{min-height:90px;resize:vertical}
.urgs{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:3px;overflow:hidden}
.urgs label{margin:0;padding:11px 4px;text-align:center;cursor:pointer;border-right:1px solid var(--line);font-weight:600}
.urgs label:last-child{border-right:0}
.urgs input{position:absolute;opacity:0}
.urgs .Urgente{background:var(--urgbg);color:var(--urg)}.urgs .Importante{background:var(--impbg);color:var(--imp)}.urgs .Normal{background:var(--norbg);color:var(--nor)}
.urgs label:has(input:checked){outline:3px solid var(--acc);outline-offset:-3px}
.row{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.row button{flex:1;min-width:140px;height:42px;border-radius:3px;border:1px solid var(--line);background:var(--paper);font-weight:600;cursor:pointer}
.row .go{background:var(--bar-n);border-color:var(--bar-n);color:#fff}.row .pri{background:var(--acc);border-color:var(--acc);color:var(--accT)}
.hist{list-style:none;margin:8px 0 0;padding:0}
.hist li{border-left:3px solid var(--line);padding:2px 0 10px 12px;font-size:.95rem}
.hist small{color:var(--mute)}
.hist.reg{background:var(--paper);border:1px solid var(--line);padding:14px 14px 4px}
.desc{background:var(--bg);padding:10px;border-radius:3px;white-space:pre-wrap}
:focus-visible{outline:3px solid var(--bar-i);outline-offset:2px}
@media(max-width:760px){
.bar{gap:6px;padding:0 10px}.tabs{width:100%;order:3}.tabs button{flex:1;padding:0 4px}
main{padding:10px 10px 24px}
.tools input{max-width:none}.tools .sp{display:none}.tools .btn{flex:1}
.wrap{border:0;background:none;overflow:visible}
table,tbody{display:block;min-width:0}thead{display:none}
tbody tr{display:flex;flex-wrap:wrap;gap:2px 12px;align-items:center;border:1px solid var(--line);border-left:6px solid var(--c);background:var(--paper);margin-bottom:8px;padding:9px 10px}
tbody tr:nth-child(even){background:var(--paper)}
td{border:0;padding:0}td:first-child{box-shadow:none;padding:0}
td.urg{order:1}td.num{order:2}td.ago{order:3;margin-left:auto}td.tit{order:4;flex-basis:100%;margin-top:2px}
td.loc,td.por,td.dat,td.fim{order:5;color:var(--mute);font-size:.88rem}}
</style>
</head>
<body>
<div class="bar">
  <h1>Manutenção do hotel</h1>
  <nav class="tabs" id="tabs" aria-label="Secções">
    <button data-v="abertos">Por resolver<span id="n1"></span></button>
    <button data-v="feitos">Concluídos<span id="n2"></span></button>
    <button data-v="registo">Registo</button>
  </nav>
  <div class="who"><span>Olá, <b id="nome"></b></span><button class="lnk" id="mudar">mudar nome</button><button class="lnk" id="tema" aria-label="Mudar entre modo claro e escuro"></button><span class="status" id="modo"></span></div>
</div>
<main>
  <div class="tools">
    <input type="search" id="q" placeholder="Pesquisar pedido, local ou pessoa" aria-label="Pesquisar pedidos">
    <select id="fu" aria-label="Filtrar por urgência"><option value="">Todas as urgências</option><option>Urgente</option><option>Importante</option><option>Normal</option></select>
    <span class="sp"></span>
    <button class="btn" id="xlBtn">Descarregar Excel</button>
    <button class="btn pri" id="novo">Novo pedido</button>
  </div>
  <p class="sum" id="sum"></p>
  <div id="lista"></div>
</main>
<dialog id="dlg"><button class="x" id="xx" aria-label="Fechar">✕</button><div class="m" id="dm"></div></dialog>

<!--
  PARTILHA ENTRE PESSOAS (opcional mas recomendado):
  Sem isto, os dados ficam só guardados NESTE dispositivo.
  Ver instruções no fim da conversa para ligar ao Firebase (gratuito).
-->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
// >>> Cola aqui a configuração do Firebase (ou deixa null para modo local) <<<
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCTvGu8Ouj-BZ-t61-6Ut8YwY0Jb937sB4",
  authDomain: "manutencao-hoteleira.firebaseapp.com",
  projectId: "manutencao-hoteleira",
  storageBucket: "manutencao-hoteleira.firebasestorage.app",
  messagingSenderId: "497842824343",
  appId: "1:497842824343:web:b094ad0b683dba10e135d2"
};

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = iso => new Date(iso).toLocaleString('pt-PT', {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
const ORDEM = {Urgente:0, Importante:1, Normal:2};
const get = k => { try { return localStorage.getItem(k); } catch(e) { return null; } };
const set = (k,v) => { try { localStorage.setItem(k,v); } catch(e) {} };

let tickets = [], view = 'abertos', nome = get('hotel_nome') || '', db = null;

/* ---------- Segurança: todos os dados recebidos são validados ---------- */
const URG = ['Normal','Importante','Urgente'];
const corta = (v, n) => String(v ?? '').slice(0, n);
const iso = v => { const d = new Date(v); return isNaN(d) ? new Date(0).toISOString() : d.toISOString(); };
function limpar(d) {
  if (!d || typeof d !== 'object' || !/^[\w-]{1,40}$/.test(String(d.id))) return null;
  return {id: String(d.id), titulo: corta(d.titulo,120), local: corta(d.local,120), desc: corta(d.desc,1000),
    urg: URG.includes(d.urg) ? d.urg : 'Normal', estado: d.estado === 'feito' ? 'feito' : 'aberto',
    criadoPor: corta(d.criadoPor,60), criadoEm: iso(d.criadoEm),
    feitoPor: d.feitoPor ? corta(d.feitoPor,60) : null, feitoEm: d.feitoEm ? iso(d.feitoEm) : null,
    hist: (Array.isArray(d.hist) ? d.hist : []).slice(0,500).map(e => ({t: iso(e && e.t), quem: corta(e && e.quem,60), acao: corta(e && e.acao,60), txt: corta(e && e.txt,1500)}))};
}

/* ---------- Armazenamento ---------- */
function iniciarArmazenamento() {
  if (FIREBASE_CONFIG && window.firebase) {
    try {
      firebase.initializeApp(FIREBASE_CONFIG);
      db = firebase.firestore();
      $('#modo').textContent = 'Ligado: todos veem os mesmos pedidos';
      db.collection('tickets').onSnapshot(snap => { tickets = snap.docs.map(d => limpar(d.data())).filter(Boolean); desenhar(); },
        () => { $('#modo').textContent = 'Sem ligação ao servidor'; });
      return;
    } catch(e) { console.error(e); }
  }
  $('#modo').textContent = 'Modo local: os dados ficam só neste dispositivo';
  try { tickets = JSON.parse(get('hotel_tickets') || '[]').map(limpar).filter(Boolean); } catch(e) { tickets = []; }
  desenhar();
}
function guardar(t) {
  const i = tickets.findIndex(x => x.id === t.id);
  if (i >= 0) tickets[i] = t; else tickets.push(t);
  if (db) db.collection('tickets').doc(t.id).set(t).catch(() => alert('Não foi possível guardar. Verifique a internet.'));
  else set('hotel_tickets', JSON.stringify(tickets));
  desenhar();
}

/* ---------- Nome ---------- */
function pedirNome(depois) {
  abrir(`<h2>Quem é você?</h2><p>O seu nome vai aparecer nos pedidos que criar ou concluir.</p>
    <input type="text" id="inNome" value="${esc(nome)}" placeholder="Ex.: Ana Silva" autocomplete="name">
    <div class="row"><button class="pri" id="okNome">Guardar</button></div>`);
  $('#okNome').onclick = () => {
    const v = $('#inNome').value.trim();
    if (!v) { $('#inNome').focus(); return; }
    nome = v.slice(0,60); set('hotel_nome', nome); $('#nome').textContent = nome; $('#dlg').close(); if (depois) depois();
  };
}
function abrir(html) { $('#dm').innerHTML = html; $('#dm').querySelectorAll('input[type=text]').forEach(i => i.maxLength = 120); $('#dm').querySelectorAll('textarea').forEach(i => i.maxLength = 1000); const d = $('#dlg'); if (!d.open) d.showModal(); }
function fechar() { $('#dlg').close(); }

/* ---------- Ecrã principal ---------- */
let pag = 0, fUrg = '', busca = '';
const PAG = 15;
const CL = {Urgente:'U', Importante:'I', Normal:'N'};
function ha(iso) {
  const m = Math.max(0, Math.floor((Date.now() - new Date(iso)) / 60000));
  if (m < 1) return 'agora';
  if (m < 60) return m + ' min';
  if (m < 1440) return Math.floor(m / 60) + ' h';
  const d = Math.floor(m / 1440); return d + (d === 1 ? ' dia' : ' dias');
}
function desenhar() {
  const ab = tickets.filter(t => t.estado === 'aberto');
  const c = u => ab.filter(t => t.urg === u).length;
  const pl = (n, s, p) => n + ' ' + (n === 1 ? s : p);
  $('#n1').textContent = ab.length; $('#n2').textContent = tickets.length - ab.length;
  document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === view));
  $('#fu').value = fUrg;
  $('#sum').innerHTML = view === 'abertos'
    ? `<b>${pl(ab.length,'pedido','pedidos')}</b> por resolver: ${pl(c('Urgente'),'urgente','urgentes')}, ${pl(c('Importante'),'importante','importantes')}, ${pl(c('Normal'),'normal','normais')}.`
    : view === 'feitos' ? `<b>${pl(tickets.length - ab.length,'pedido','pedidos')}</b> concluídos.`
    : `<b>${pl(tickets.reduce((n,t) => n + t.hist.length, 0),'registo','registos')}</b> de tudo o que foi feito.`;

  const num = {}; [...tickets].sort((a,b) => a.criadoEm.localeCompare(b.criadoEm)).forEach((t,i) => num[t.id] = i + 1);
  const q = busca.toLowerCase();
  const bate = t => (!fUrg || t.urg === fUrg) && (!q || [t.titulo, t.local, t.desc, t.criadoPor].join(' ').toLowerCase().includes(q));
  const filtrado = !!(fUrg || q);
  const fatia = l => { const n = Math.max(1, Math.ceil(l.length / PAG)); if (pag >= n) pag = n - 1; return l.slice(pag * PAG, pag * PAG + PAG); };
  const linha = t => {
    const feito = t.estado === 'feito';
    return `<tr class="${CL[t.urg]}" data-id="${esc(t.id)}" tabindex="0"><td class="urg"><span class="u">${t.urg}</span></td><td class="num">${num[t.id]}</td><td class="tit">${esc(t.titulo)}</td><td class="loc">${esc(t.local)}</td><td class="por">${esc(t.criadoPor)}</td><td class="dat">${fmt(t.criadoEm)}</td>`
      + (feito ? `<td class="fim">${esc(t.feitoPor)}</td><td class="dat fim">${t.feitoEm ? fmt(t.feitoEm) : ''}</td>` : `<td class="ago">${ha(t.criadoEm)}</td>`) + '</tr>';
  };
  let h = '', total = 0;
  if (view === 'registo') {
    const ev = tickets.filter(bate).flatMap(t => (t.hist||[]).map(e => ({...e, titulo:t.titulo, local:t.local}))).sort((a,b) => b.t.localeCompare(a.t));
    total = ev.length;
    h = total ? `<ul class="hist reg">${fatia(ev).map(e => `<li><b>${esc(e.quem)}</b> ${esc(e.acao)} “${esc(e.titulo)}”${e.local ? ' ('+esc(e.local)+')' : ''}${e.txt ? `<br>${esc(e.txt)}` : ''}<br><small>${fmt(e.t)}</small></li>`).join('')}</ul>`
      : `<div class="empty">${filtrado ? 'Nenhum registo encontrado.' : 'Ainda não há registos.'}</div>`;
  } else {
    const l = tickets.filter(t => t.estado === (view === 'abertos' ? 'aberto' : 'feito') && bate(t))
      .sort(view === 'abertos' ? (a,b) => ORDEM[a.urg] - ORDEM[b.urg] || a.criadoEm.localeCompare(b.criadoEm) : (a,b) => (b.feitoEm||'').localeCompare(a.feitoEm||''));
    total = l.length;
    const cab = view === 'abertos' ? ['Urgência','Nº','Pedido','Local','Criado por','Data','Aberto há'] : ['Urgência','Nº','Pedido','Local','Criado por','Data','Concluído por','Concluído em'];
    h = total ? `<div class="wrap"><table><thead><tr>${cab.map(x => `<th>${x}</th>`).join('')}</tr></thead><tbody>${fatia(l).map(linha).join('')}</tbody></table></div>`
      : `<div class="empty">${filtrado ? 'Nenhum pedido encontrado.' : view === 'abertos' ? 'Não há pedidos por resolver.<br>Carregue em “Novo pedido” para criar um.' : 'Ainda não há pedidos concluídos.'}</div>`;
  }
  if (total > PAG) h += `<div class="pg"><span>A mostrar ${pag*PAG+1}–${Math.min(total,(pag+1)*PAG)} de ${total}</span><span><button id="pv" ${pag === 0 ? 'disabled' : ''}>‹ Anterior</button><button id="px" ${(pag+1)*PAG >= total ? 'disabled' : ''}>Seguinte ›</button></span></div>`;
  $('#lista').innerHTML = h;
  document.querySelectorAll('tbody tr[data-id]').forEach(e => {
    e.onclick = () => ver(e.dataset.id);
    e.onkeydown = ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); ver(e.dataset.id); } };
  });
  if ($('#pv')) { $('#pv').onclick = () => { pag--; desenhar(); }; $('#px').onclick = () => { pag++; desenhar(); }; }
}

/* ---------- Novo pedido ---------- */
function novo() {
  if (!nome) return pedirNome(novo);
  abrir(`<h2>Novo pedido de reparação</h2>
    <label for="fT">O que precisa de ser reparado?</label>
    <input type="text" id="fT" placeholder="Ex.: Torneira a pingar">
    <label for="fL">Onde? (quarto, zona…)</label>
    <input type="text" id="fL" placeholder="Ex.: Quarto 204">
    <label for="fD">Mais detalhes (opcional)</label>
    <textarea id="fD"></textarea>
    <label>Quão urgente é?</label>
    <div class="urgs">
      <label class="Normal"><input type="radio" name="u" value="Normal" checked>Normal</label>
      <label class="Importante"><input type="radio" name="u" value="Importante">Importante</label>
      <label class="Urgente"><input type="radio" name="u" value="Urgente">Urgente</label>
    </div>
    <p style="color:var(--mute);font-size:.9rem">Criado por <b>${esc(nome)}</b>. A data fica guardada automaticamente.</p>
    <div class="row"><button id="cx">Cancelar</button><button class="pri" id="ok">Criar pedido</button></div>`);
  $('#cx').onclick = fechar;
  $('#ok').onclick = () => {
    const titulo = $('#fT').value.trim();
    if (!titulo) { $('#fT').focus(); $('#fT').style.borderColor = 'var(--urg)'; return; }
    const agora = new Date().toISOString();
    guardar({id: 't' + Date.now().toString(36) + Math.random().toString(36).slice(2,6), titulo, local: $('#fL').value.trim(), desc: $('#fD').value.trim(),
      urg: document.querySelector('input[name=u]:checked').value, criadoPor: nome, criadoEm: agora, estado: 'aberto',
      hist: [{t: agora, quem: nome, acao: 'criou o pedido', txt: ''}]});
    view = 'abertos'; fechar(); desenhar();
  };
  setTimeout(() => $('#fT').focus(), 50);
}

/* ---------- Ver / concluir pedido ---------- */
function ver(id) {
  if (!nome) return pedirNome(() => ver(id));
  const t = tickets.find(x => x.id === id); if (!t) return;
  const feito = t.estado === 'feito';
  abrir(`<span class="badge b-${feito ? 'Concluído' : t.urg}">${feito ? 'Concluído' : t.urg}</span>
    <h2 style="margin-top:8px">${esc(t.titulo)}</h2>
    ${t.local ? `<p>${esc(t.local)}</p>` : ''}
    ${t.desc ? `<div class="desc">${esc(t.desc)}</div>` : ''}
    <label>Histórico</label>
    <ul class="hist">${(t.hist||[]).map(e => `<li><b>${esc(e.quem)}</b> ${esc(e.acao)}${e.txt ? `<br>${esc(e.txt)}` : ''}<br><small>${fmt(e.t)}</small></li>`).join('')}</ul>
    <label for="fC">${feito ? 'Adicionar um comentário' : 'Comentário (opcional)'}</label>
    <textarea id="fC" placeholder="${feito ? 'Ex.: Foi preciso trocar a peça…' : 'Ex.: Trabalho feito, trocada a borracha.'}"></textarea>
    <div class="row">
      <button id="fe">Fechar</button>
      ${String(t.criadoPor).toLowerCase() === nome.toLowerCase() ? '<button id="ed">Corrigir pedido</button>' : ''}
      <button id="cm">Guardar comentário</button>
      ${feito ? '<button id="re">Reabrir pedido</button>' : '<button class="go" id="cc">Marcar como concluído</button>'}
    </div>`);
  const regista = (acao, extra) => {
    const txt = $('#fC').value.trim();
    return {...t, ...extra, hist: [...(t.hist||[]), {t: new Date().toISOString(), quem: nome, acao, txt}]};
  };
  $('#fe').onclick = fechar;
  if ($('#ed')) $('#ed').onclick = () => editar(id);
  $('#cm').onclick = () => {
    if (!$('#fC').value.trim()) { $('#fC').focus(); return; }
    guardar(regista('deixou um comentário')); ver(id);
  };
  if (feito) $('#re').onclick = () => { guardar(regista('reabriu o pedido', {estado:'aberto', feitoPor:null, feitoEm:null})); fechar(); };
  else $('#cc').onclick = () => {
    const agora = new Date().toISOString();
    guardar(regista('concluiu o pedido', {estado:'feito', feitoPor:nome, feitoEm:agora})); fechar();
  };
}

/* ---------- Corrigir pedido (só quem criou) ---------- */
function editar(id) {
  const t = tickets.find(x => x.id === id); if (!t) return;
    abrir(`<h2>Corrigir pedido</h2>
    <label for="eT">O que precisa de ser reparado?</label>
    <input type="text" id="eT" value="${esc(t.titulo)}">
    <label for="eL">Onde? (quarto, zona…)</label>
    <input type="text" id="eL" value="${esc(t.local)}">
    <label for="eD">Mais detalhes</label>
    <textarea id="eD">${esc(t.desc)}</textarea>
    <label>Quão urgente é?</label>
    <div class="urgs">${['Normal','Importante','Urgente'].map(u => `<label class="${u}"><input type="radio" name="u" value="${u}" ${t.urg === u ? 'checked' : ''}>${u}</label>`).join('')}</div>
    <p style="color:var(--mute);font-size:.9rem">O que for alterado fica registado no histórico.</p>
    <div class="row"><button id="cx">Cancelar</button><button class="pri" id="ok">Guardar alterações</button></div>`);
  $('#cx').onclick = () => ver(id);
  $('#ok').onclick = () => {
    const n = {titulo: $('#eT').value.trim(), local: $('#eL').value.trim(), desc: $('#eD').value.trim(), urg: document.querySelector('input[name=u]:checked').value};
    if (!n.titulo) { $('#eT').focus(); $('#eT').style.borderColor = 'var(--urg)'; return; }
    const nomes = {titulo:'Pedido', local:'Local', desc:'Detalhes', urg:'Urgência'};
    const mudou = Object.keys(n).filter(k => (t[k] || '') !== n[k]).map(k => k === 'desc' ? 'Detalhes alterados' : `${nomes[k]}: “${t[k] || '—'}” → “${n[k] || '—'}”`);
    if (!mudou.length) return ver(id);
    guardar({...t, ...n, hist: [...(t.hist||[]), {t: new Date().toISOString(), quem: nome, acao: 'corrigiu o pedido', txt: mudou.join('; ')}]});
    ver(id);
  };
}

/* ---------- Exportar para Excel ---------- */
function exportar() {
  if (!window.XLSX) { alert('Não foi possível preparar o Excel (sem internet?). Vai ser descarregado um ficheiro CSV, que também abre no Excel.'); return exportarCSV(); }
  const ord = [...tickets].sort((a,b) => a.criadoEm.localeCompare(b.criadoEm));
  const pedidos = ord.map((t,i) => ({
    'Nº': i + 1, 'Pedido': t.titulo, 'Local': t.local || '', 'Descrição': t.desc || '', 'Urgência': t.urg,
    'Estado': t.estado === 'feito' ? 'Concluído' : 'Por resolver',
    'Criado por': t.criadoPor, 'Data de criação': fmt(t.criadoEm),
    'Concluído por': t.feitoPor || '', 'Data de conclusão': t.feitoEm ? fmt(t.feitoEm) : '',
    'Comentários': (t.hist||[]).filter(e => e.txt && e.acao !== 'corrigiu o pedido').map(e => fmt(e.t) + ' – ' + e.quem + ': ' + e.txt).join('\n')
  }));
  const reg = ord.flatMap(t => (t.hist||[]).map(e => ({_t: e.t, 'Data': fmt(e.t), 'Pessoa': e.quem, 'Ação': e.acao, 'Pedido': t.titulo, 'Local': t.local || '', 'Urgência': t.urg, 'Comentário / alterações': e.txt || ''})))
    .sort((a,b) => a._t.localeCompare(b._t)).map(({_t, ...r}) => r);
  const wb = XLSX.utils.book_new();
  const w1 = XLSX.utils.json_to_sheet(pedidos);
  w1['!cols'] = [{wch:5},{wch:30},{wch:16},{wch:40},{wch:11},{wch:13},{wch:16},{wch:17},{wch:16},{wch:17},{wch:60}];
  const w2 = XLSX.utils.json_to_sheet(reg);
  w2['!cols'] = [{wch:17},{wch:16},{wch:24},{wch:30},{wch:16},{wch:11},{wch:50}];
  XLSX.utils.book_append_sheet(wb, w1, 'Pedidos');
  XLSX.utils.book_append_sheet(wb, w2, 'Registo completo');
  XLSX.writeFile(wb, 'manutencao-hotel-' + new Date().toISOString().slice(0,10) + '.xlsx');
}
function exportarCSV() {
  const q = v => { let s = String(v ?? ''); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; return '"' + s.replace(/"/g, '""') + '"'; };
  const linhas = [['Data','Pessoa','Ação','Pedido','Local','Urgência','Comentário']];
  tickets.forEach(t => (t.hist||[]).forEach(e => linhas.push([fmt(e.t), e.quem, e.acao, t.titulo, t.local, t.urg, e.txt])));
  linhas.slice(1).sort((a,b) => 0);
  const blob = new Blob(['\ufeff' + linhas.map(l => l.map(q).join(';')).join('\r\n')], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'registo-manutencao-' + new Date().toISOString().slice(0,10) + '.csv'; a.click();
}

/* ---------- Arranque ---------- */
$('#nome').textContent = nome || '(sem nome)';
$('#mudar').onclick = () => pedirNome();
$('#novo').onclick = novo;
$('#xlBtn').onclick = exportar;
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => { view = b.dataset.v; pag = 0; desenhar(); });
$('#q').oninput = e => { busca = e.target.value.trim(); pag = 0; desenhar(); };
$('#fu').onchange = e => { fUrg = e.target.value; pag = 0; desenhar(); };
$('#xx').onclick = fechar;
const mq = matchMedia('(prefers-color-scheme: dark)');
const escuro = () => { const t = document.documentElement.dataset.theme; return t ? t === 'dark' : mq.matches; };
const etiquetaTema = () => { $('#tema').textContent = escuro() ? 'modo claro' : 'modo escuro'; };
$('#tema').onclick = () => {
  const novo = escuro() ? 'claro' : 'escuro';
  document.documentElement.dataset.theme = novo === 'escuro' ? 'dark' : 'light';
  set('hotel_tema', novo); etiquetaTema();
};
if (mq.addEventListener) mq.addEventListener('change', etiquetaTema);
etiquetaTema();
iniciarArmazenamento();
if (!nome) pedirNome();
</script>
